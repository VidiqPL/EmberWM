# EmberWM: red dusk default. Use wallpaper = "" for the lowest idle RAM.
terminal = [
    "kitty",
    "--class",
    "{app_id}",
    "--override",
    "linux_display_server=wayland",
    "--override",
    "background={background}",
    "--override",
    "foreground={foreground}",
    "--override",
    "hide_window_decorations=yes",
    "--override",
    "font_size=9.0",
    "--override",
    "window_padding_width=8",
    "--override",
    "cursor={accent}",
    "--override",
    "background_opacity=1.0",
]

# Native control center. Remove/reorder tabs here.
[menu]
enabled = true
title = "EmberWM"
width = 640
height = 620
tabs = ["wifi", "tray", "power"]

[xwayland]
# Start X11 compatibility only when an X11 app or clipboard client connects.
enabled = true

[display]
refresh_hz = 0.0

[audio]
enabled = true
osd_enabled = true
osd_duration_ms = 1000

[theme]
background = "#23181a"
active_border = "#793b48"
inactive_border = "#23181a"
selection = "#b35c70"
selection_opacity = 0.4
border_width = 1
wallpaper = "../assets/abbey-oakwood.jpg"
wallpaper_mode = "fill"
# Native colouring of the downloaded original; not the exact red edit from the video.
wallpaper_palette = ["#1b0b0e", "#b3696a"]

[layout]
gap = 10
master_ratio = 0.58
workspaces = 10
default_floating = false

[keyboard]
modifier = "Alt"
xkb_layout = "us"
repeat_delay = 300
repeat_rate = 30

[[bindings]]
key = "Return"
action = "terminal"
shift = false

