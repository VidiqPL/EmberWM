# Native panels: remove all with enabled = false or items = [].
[panels]
enabled = true
font = "builtin"
font_size = 11.0
height = 21
margin = 8
padding = 6
spacing = 4
workspace_padding = 9
background = "#201517"
foreground = "#d4c5c8"
accent = "#b86b7c"
border_color = "#60313c"
border_width = 0
opacity = 0.96
hide_empty_workspaces = true
hide_on_fullscreen = true
poll_interval_secs = 5

[[panels.items]]
name = "main"
offset_x = 4
anchor = "top-left"
modules = ["workspaces", "clock"]
clock_format = "%H:%M"
reserve_space = true

# Enable this panel or copy it to add more panels.
[[panels.items]]
name = "system"
enabled = false
anchor = "top-right"
modules = ["cpu", "memory", "volume"]
reserve_space = true

[[bindings]]
key = "b"
action = "panels-toggle"

# The sheet is generated from the bindings above; changes appear after Mod+R.
[[bindings]]
key = "slash"
action = "shortcuts-toggle"

[[bindings]]
key = "n"
action = "notification-dismiss"

[shortcuts]
enabled = true
width = 860
font_size = 12.0

[notifications]
enabled = true
compact = true
respect_panel_space = false
width = 360
margin = 12
gap = 8
max_visible = 4
max_queued = 32
timeout_ms = 5000
do_not_disturb = false
critical_bypass_dnd = true

[[bindings]]
key = "0"
action = "workspace 10"

[[bindings]]
key = "0"
shift = true
action = "send 10"

# Global F11 toggles the focused window; remove to let apps receive F11 themselves.
[[bindings]]
key = "F11"
action = "fullscreen"
modifier = false

# Example only: enable and customize it to place Sober on workspace 10.
[[window_rules]]
name = "Sober example"
enabled = false
app_id = "org.vinegarhq.Sober"
workspace = 10
follow = true

[[bindings]]
key = "s"
shift = true
action = "screenshot-region"

# Native Wi-Fi popup; inherits panel colours and font.
[wifi]
enabled = true
width = 540
font_size = 13.0

[[bindings]]
key = "period"
action = "menu-toggle"

[launcher]
enabled = true
width = 640
font_size = 14.0
rows = 8

[[bindings]]
key = "space"
shift = true
action = "float"

# Portal screen sharing is on demand and asks before sharing.
[screencast]
enabled = true

# Release game mouse capture; cycle appearance presets.
[[bindings]]
key = "Escape"
action = "pointer-release"

[[bindings]]
key = "t"
action = "theme-cycle"

# Complete appearance profiles (panels, spacing, fonts and wallpaper).
[rice]
profile = ""

[[bindings]]
key = "t"
shift = true
action = "rice-cycle"

# Floating scratchpad group, inspired by the Hyprland magic special workspace.
[[bindings]]
key = "g"
shift = true
action = "scratchpad-mark"

[[bindings]]
key = "g"
action = "scratchpad-toggle"

[[bindings]]
key = "comma"
action = "tray-toggle"

[tray]
enabled = true
width = 460
font_size = 13.0
