[package]
name = "emberwm"
version = "0.15.10"
edition = "2021"
license = "MIT"
description = "A minimal, configurable Wayland compositor with a red heart"

[dependencies]
smithay = { version = "=0.7.0", default-features = false, features = ["backend_winit", "backend_drm", "backend_gbm", "backend_libinput", "backend_udev", "backend_session_libseat", "wayland_frontend", "desktop", "xwayland"] }
# Enable the bounded event-queue API on Smithay's existing server dependency.
wayland-server = { version = "0.31.14", features = ["libwayland_1_23"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
signal-hook = "0.3"
fontdue = { version = "0.9", default-features = false }
libc = "0.2"
dbus = "0.9.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
drm-ffi = "0.9"

[patch.crates-io]
# Pinned 0.7 source plus the documented non-text selection atom fix.
smithay = { path = "vendor/smithay" }
